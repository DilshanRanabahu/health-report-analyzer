version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      args:
        VITE_API_URL: "http://${PUBLIC_IP}:8000/api"
        VITE_LOGIN_URL: "http://${PUBLIC_IP}:8000/login"
    ports:
      - "80:80"
      - "5173:80" # Keeping 5173 for local familiarity, but mapping to 80 internal
    depends_on:
      - api_manager

  api_manager:
    build:
      context: .
      dockerfile: api_manager/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://${PUBLIC_IP},http://${PUBLIC_IP}:5173,http://localhost,http://localhost:5173
      - BACKEND_URL=http://backend:8001
      - FRONTEND_URL=http://${PUBLIC_IP}
    volumes:
      - ./auth.db:/app/auth.db
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - CORS_ORIGINS=http://${PUBLIC_IP},http://${PUBLIC_IP}:8000,http://${PUBLIC_IP}:5173,http://localhost,http://localhost:8000,http://localhost:5173
      - GITHUB_TOKEN=${GITHUB_TOKEN} # Needed for CrewAI / GitHub Models
    volumes:
      - ./health_reports.db:/app/health_reports.db
      - ./backend/uploads:/app/backend/uploads
