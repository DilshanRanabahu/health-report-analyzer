version: '3.8'

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    # Mount the local frontend folder so changes reflect instantly
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node_modules from overwriting container's
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_LOGIN_URL=http://localhost:8000/login
    # Start the Vite dev server
    command: sh -c "npm install && npm run dev -- --host"

  api_manager:
    build:
      context: .
      dockerfile: api_manager/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api_manager:/app/api_manager
      - ./auth.db:/app/auth.db
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://localhost
      - BACKEND_URL=http://backend:8001
      - FRONTEND_URL=http://localhost:5173
    # Use --reload for auto-restarting on code changes
    command: uvicorn api_manager.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
      - ./health_reports.db:/app/health_reports.db
      - ./backend/uploads:/app/backend/uploads
    environment:
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://localhost
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    # Use --reload for auto-restarting on code changes
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8001 --reload
